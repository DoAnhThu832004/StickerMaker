name: Android CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

# Tự động hủy bản build cũ nếu có commit mới được đẩy lên cùng nhánh
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Sử dụng JDK 21 khớp với toolchainVersion trong gradle-daemon-jvm.properties
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle with Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Chạy Lint, Unit Test và Build APK trong 1 phiên duy nhất
      - name: Run Tests, Lint and Build Debug APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      # Chỉ lưu file APK khi gộp vào nhánh chính và tự động dọn dẹp sau 5 ngày
      - name: Upload Debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sticker-maker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
